<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone iOS - Sunset RP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            width: 100vw; height: 100vh; background: #000;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .iphone-container {
            width: 375px; height: 812px;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=375&auto=format&fit=crop') center/cover;
            position: relative; overflow: hidden;
            border-radius: 44px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 3px solid #2c2c2e;
        }

        /* BARRE DE STATUT & ILE DYNAMIQUE */
        .status-bar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 14px; font-weight: 500; z-index: 999; color: white; position: absolute; width: 100%; top: 0; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 110px; height: 28px; background: #000; border-radius: 20px; z-index: 1000; }

        /* ECRAN D'ACCUEIL */
        .home-screen { padding-top: 55px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 12px; padding: 15px 20px; align-content: start; }
        .app { display: flex; flex-direction: column; align-items: center; cursor: pointer; }

        /* Icônes iOS nettes et épurées */
        .app-icon {
            width: 60px; height: 60px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25); transition: transform 0.1s ease;
        }
        .app:active .app-icon { transform: scale(0.85); }
        .app-icon svg { width: 30px; height: 30px; fill: #ffffff; }
        .app-name { font-size: 11px; margin-top: 5px; text-align: center; font-weight: 400; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        .dock { margin: 10px 15px 20px 15px; padding: 12px; background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(30px); border-radius: 32px; display: flex; justify-content: space-around; border: 0.5px solid rgba(255,255,255,0.3); }
        .home-bar { width: 130px; height: 4px; background: white; border-radius: 4px; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); z-index: 9999; opacity: 0.8; }

        /* FENETRE DE L'APPLICATION */
        .app-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; z-index: 2000; display: none; flex-direction: column;
            animation: slideUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { height: 50px; background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(15px); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: white; border-bottom: 0.5px solid #38383a; margin-top: 35px; }
        .modal-title { font-weight: 600; font-size: 16px; }
        .close-btn { background: #3a3a3c; border: none; color: #0a84ff; padding: 5px 12px; border-radius: 14px; font-weight: 500; font-size: 14px; cursor: pointer; }
        .modal-body { padding: 20px; color: white; flex-grow: 1; overflow-y: auto; font-size: 14px; }

        /* INTERFACES INTERNES FONCTIONNELLES */
        /* Calculatrice iOS Style */
        .calc-screen { width: 100%; background: transparent; color: white; font-size: 55px; text-align: right; border: none; margin-bottom: 20px; font-weight: 300; outline: none; }
        .calc-pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .c-btn { background: #333336; color: white; border: none; height: 65px; border-radius: 50%; font-size: 22px; cursor: pointer; font-weight: 500; display: flex; align-items: center; justify-content: center; }
        .c-btn:active { filter: brightness(1.3); }
        .c-btn.gray { background: #a5a5ad; color: #000; }
        .c-btn.orange { background: #ff9f0a; color: white; font-size: 26px; }
        .c-btn.zero { grid-column: span 2; border-radius: 35px; justify-content: flex-start; padding-left: 25px; }

        /* Notes Style */
        .notes-area { width: 100%; height: 80%; background: #1c1c1e; color: #f2f2f7; border: none; border-radius: 12px; padding: 15px; font-size: 16px; resize: none; outline: none; }

        /* Store Style */
        .shop-card { background: #1c1c1e; padding: 16px; border-radius: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 0.5px solid #2c2c2e; }
        .buy-btn { background: #0a84ff; color: white; border: none; padding: 8px 16px; border-radius: 16px; font-weight: 600; cursor: pointer; }

        /* Messages Style */
        .msg-bubble { background: #262629; padding: 12px 16px; border-radius: 18px; margin-bottom: 10px; max-width: 80%; line-height: 1.4; }
        .msg-bubble.me { background: #0a84ff; margin-left: auto; }

        /* Couleurs d'icônes iOS modernes */
        .bg-settings { background: #8e8e93; }
        .bg-store { background: linear-gradient(135deg, #ff9500, #ff2d55); }
        .bg-calc { background: #2c2c2e; }
        .bg-notes { background: #ffcc00; }
        .bg-twitter { background: #000000; border: 0.5px solid #333; }
        .bg-snap { background: #fffc00; }
        .bg-printers { background: #34c759; }
        .bg-annonces { background: #ff3b30; }
        .bg-secu { background: #0a84ff; }
        .bg-famille { background: #af52de; }
        .bg-jeux { background: #ff2d55; }
        .bg-gouv { background: #636366; }
        .bg-services { background: #5ac8fa; }
        .bg-marley { background: #ff375f; }
        .bg-phone { background: #32d74b; }
        .bg-msg { background: #30b0c7; }
        .bg-photos { background: linear-gradient(135deg, #007aff, #5856d6); }
        .bg-safari { background: #1c1c1e; }
    </style>
</head>
<body>

    <div class="iphone-container">

        <div class="status-bar">
            <span id="top-time">19:21</span>
            <div>📶 5G 🔋</div>
        </div>
        <div class="dynamic-island"></div>

        <!-- ECRAN D'ACCUEIL -->
        <div class="home-screen">
            <div class="app-grid">
                <div class="app" onclick="openApp('Réglages', appSettings)">
                    <div class="app-icon bg-settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>
                    <span class="app-name">Réglages</span>
                </div>

                <div class="app" onclick="openApp('Store', appStore)">
                    <div class="app-icon bg-store"><svg viewBox="0 0 24 24"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg></div>
                    <span class="app-name">Store</span>
                </div>

                <div class="app" onclick="openApp('Calculatrice', appCalculator)">
                    <div class="app-icon bg-calc"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2z"/></svg></div>
                    <span class="app-name">Calculatrice</span>
                </div>

                <div class="app" onclick="openApp('Notes', appNotes)">
                    <div class="app-icon bg-notes"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg></div>
                    <span class="app-name">Notes</span>
                </div>

                <div class="app" onclick="openApp('X', '<p style=\'color:#aaa;\'>Fil d\'actualité en direct :</p><br><p><b>@Citoyen_Sunset:</b> Serveur incroyable, force au staff !</p>')">
                    <div class="app-icon bg-twitter"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231z"/></svg></div>
                    <span class="app-name">X</span>
                </div>

                <div class="app" onclick="openApp('Snapchat', '<p style=\'text-align:center;color:#666;margin-top:40px;\'>Aucune story disponible.</p>')">
                    <div class="app-icon bg-snap"><svg viewBox="0 0 24 24" style="fill:#000;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg></div>
                    <span class="app-name">Snap</span>
                </div>

                <div class="app" onclick="openApp('Printers', '<p>⚡ Générateur #1 : <b>En marche</b> ($400/min)</p><br><p>⚡ Générateur #2 : <b>En marche</b> ($400/min)</p>')">
                    <div class="app-icon bg-printers"><svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3z"/></svg></div>
                    <span class="app-name">Printers</span>
                </div>

                <div class="app" onclick="openApp('Annonces', '<p><b>⚠️ Mairie :</b> Couvre-feu total à partir de 03h00 du matin sur l\'ensemble de la ville.</p>')">
                    <div class="app-icon bg-annonces"><svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9z"/></svg></div>
                    <span class="app-name">Annonces</span>
                </div>

                <div class="app" onclick="openApp('Sécurité', '<p>🚨 <b>Police :</b> 17</p><br><p>🚑 <b>Ambulance :</b> 15</p><br><p>🔧 <b>Dépanneur :</b> Actif</p>')">
                    <div class="app-icon bg-secu"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4z"/></svg></div>
                    <span class="app-name">Sécurité</span>
                </div>

                <div class="app" onclick="openApp('Famille', '<p style=\'color:#888;\'>Aucun membre de la famille localisé.</p>')">
                    <div class="app-icon bg-famille"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3z"/></svg></div>
                    <span class="app-name">Famille</span>
                </div>

                <div class="app" onclick="openApp('Jeux', '<p style=\'text-align:center;\'>🎮 <b>Casino Sunset</b><br><br>Bientôt disponible...</p>')">
                    <div class="app-icon bg-jeux"><svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg></div>
                    <span class="app-name">Jeux</span>
                </div>

                <div class="app" onclick="openApp('Gouvernement', '<p>📜 Statut fiscal : <b>En règle</b></p><br><p>🛡️ Permis d\'arme : <b>Valide</b></p>')">
                    <div class="app-icon bg-gouv"><svg viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12z"/></svg></div>
                    <span class="app-name">Gouv.</span>
                </div>

                <div class="app" onclick="openApp('Services', '<p>Demander un service en ville :</p><br><button class=\'buy-btn\' style=\'width:100%%;margin-bottom:10px;\'>Appeler un Taxi</button><button class=\'buy-btn\' style=\'width:100%%;\'>Appeler un Mécanicien</button>')">
                    <div class="app-icon bg-services"><svg viewBox="0 0 24 24"><path d="M12 11c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
                    <span class="app-name">Services</span>
                </div>

                <div class="app" onclick="openApp('Marley', '<p>🎵 En écoute : <b>Sunset Anthem (Remix)</b></p><br><div style=\'background:#222;height:6px;border-radius:3px;width:100%%;margin-top:15px;\'><div style=\'background:#ff375f;width:45%%;height:100%%;border-radius:3px;\'></div></div>')">
                    <div class="app-icon bg-marley"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5z"/></svg></div>
                    <span class="app-name">Marley</span>
                </div>
            </div>

            <!-- DOCK -->
            <div class="dock">
                <div class="app" onclick="openApp('Téléphone', '<p style=\'color:#888;\'>Aucun appel récent.</p>')"><div class="app-icon bg-phone"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1z"/></svg></div></div>
                <div class="app" onclick="openApp('Messages', appMessages)"><div class="app-icon bg-msg"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div></div>
                <div class="app" onclick="openApp('Photos', '<p style=\'text-align:center;color:#888;margin-top:40px;\'>Aucune image enregistrée.</p>')"><div class="app-icon bg-photos"><svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9z"/></svg></div></div>
                <div class="app" onclick="openApp('Safari', '<p style=\'color:#888;\'>Page d\'accueil SunsetNet</p>')"><div class="app-icon bg-safari"><svg viewBox="0 0 24 24" style="fill:#0a84ff;"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div></div>
            </div>
        </div>

        <!-- MODALE -->
        <div class="app-modal" id="appModal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">App</span>
                <button class="close-btn" onclick="closeApp()">OK</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>

        <div class="home-bar"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('top-time').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000); updateClock();

        function openApp(name, content) {
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalBody').innerHTML = typeof content === 'function' ? content() : content;
            document.getElementById('appModal').style.display = 'flex';
        }

        function closeApp() {
            document.getElementById('appModal').style.display = 'none';
        }

        // --- APP 1 : CALCULATRICE FONCTIONNELLE ---
        function appCalculator() {
            return `
                <input type="text" class="calc-screen" id="cRes" readonly value="0">
                <div class="calc-pad">
                    <button class="c-btn gray" onclick="cClear()">AC</button>
                    <button class="c-btn gray" onclick="cVal('+/-')">+/-</button>
                    <button class="c-btn gray" onclick="cVal('%')">%</button>
                    <button class="c-btn orange" onclick="cVal('/')">÷</button>
                    <button class="c-btn" onclick="cVal('7')">7</button>
                    <button class="c-btn" onclick="cVal('8')">8</button>
                    <button class="c-btn" onclick="cVal('9')">9</button>
                    <button class="c-btn orange" onclick="cVal('*')">×</button>
                    <button class="c-btn" onclick="cVal('4')">4</button>
                    <button class="c-btn" onclick="cVal('5')">5</button>
                    <button class="c-btn" onclick="cVal('6')">6</button>
                    <button class="c-btn orange" onclick="cVal('-')">-</button>
                    <button class="c-btn" onclick="cVal('1')">1</button>
                    <button class="c-btn" onclick="cVal('2')">2</button>
                    <button class="c-btn" onclick="cVal('3')">3</button>
                    <button class="c-btn orange" onclick="cVal('+')">+</button>
                    <button class="c-btn zero" onclick="cVal('0')">0</button>
                    <button class="c-btn" onclick="cVal('.')">.</button>
                    <button class="c-btn orange" onclick="cCalc()">=</button>
                </div>
            `;
        }

        function cVal(v) {
            let r = document.getElementById('cRes');
            if(r.value === '0' && v !== '.') r.value = v;
            else r.value += v;
        }
        function cClear() { document.getElementById('cRes').value = '0'; }
        function cCalc() {
            let r = document.getElementById('cRes');
            try { r.value = eval(r.value.replace('÷', '/').replace('×', '*')); }
            catch { r.value = 'Erreur'; }
        }

        // --- APP 2 : NOTES AVEC SAUVEGARDE LOCALE ---
        function appNotes() {
            let saved = localStorage.getItem('sunset_note') || '';
            setTimeout(() => {
                let ta = document.getElementById('noteArea');
                if(ta) ta.value = saved;
            }, 50);
            return `
                <textarea id="noteArea" class="notes-area" placeholder="Tapez votre note ici..."></textarea>
                <button class="buy-btn" style="width:100%;margin-top:10px;" onclick="saveNote()">Sauvegarder</button>
            `;
        }
        function saveNote() {
            let val = document.getElementById('noteArea').value;
            localStorage.setItem('sunset_note', val);
            alert('Note enregistrée avec succès !');
        }

        // --- APP 3 : STORE INTERACTIF ---
        function appStore() {
            return `
                <div class="shop-card"><div><b>VIP Gold (30j)</b><br>$10,000</div><button class="buy-btn" onclick="alert('Achat effectué !')">Acheter</button></div>
                <div class="shop-card"><div><b>Pack Armes Létales</b><br>$25,000</div><button class="buy-btn" onclick="alert('Achat effectué !')">Acheter</button></div>
                <div class="shop-card"><div><b>Coffret Immersif</b><br>$5,000</div><button class="buy-btn" onclick="alert('Achat effectué !')">Acheter</button></div>
            `;
        }

        // --- APP 4 : REGLAGES INTERACTIFS ---
        function appSettings() {
            return `
                <div class="shop-card"><div>Mode Avion</div><input type="checkbox" onchange="alert('Mode avion modifié')"></div>
                <div class="shop-card"><div>Notifications</div><input type="checkbox" checked onchange="alert('Paramètre mis à jour')"></div>
                <div class="shop-card"><div>Luminosité Auto</div><input type="checkbox" checked></div>
            `;
        }

        // --- APP 5 : MESSAGES ---
        function appMessages() {
            return `
                <div class="msg-bubble">Hey, tu te connectes ce soir sur Sunset RP ?</div>
                <div class="msg-bubble me">Grave, on se retrouve au spawn principal !</div>
            `;
        }
    </script>
</body>
</html>
